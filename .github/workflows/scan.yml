name: scan

on:
  schedule:
    # Signals only fire when a 4h candle closes, so every 30 min is generous.
    # Offset from :00/:30 so the scan and the bot listener do not fight for a
    # runner at the same minute.
    - cron: "5,35 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Its own group, so the bot's listen windows never cancel a queued scan.
# The two workflows touch different files in state/, and the push step below
# rebases and retries, so they can safely overlap.
concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan market and send signals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py --send

      - name: Persist sent-signal state
        if: always()
        run: |
          if [ -z "$(git status --porcelain state/)" ]; then
            echo "no new signals, state unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git commit -m "state: record sent signals"
          # scan.yml and bot.yml can land at the same moment; back off and retry
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 10))
          done
          echo "could not push state after 5 attempts"
          exit 1
