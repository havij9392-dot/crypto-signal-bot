name: bot

on:
  schedule:
    # Telegram needs someone listening. Actions cannot hold a process forever,
    # so the bot wakes up every 5 minutes and listens for ~4 of them.
    # Expect a reply within 5-15 minutes - GitHub often delays short crons.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Shared with scan.yml so the two never write to state/ at the same moment.
concurrency:
  group: state
  cancel-in-progress: false

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Listen for commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py 200

      - name: Persist account settings
        run: |
          if [ -d state ] && [ -n "$(git status --porcelain state/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "state: account settings"
            git pull --rebase origin main
            git push
          else
            echo "no changes"
          fi
