name: bot

on:
  schedule:
    # Telegram needs someone listening. Actions cannot hold a process forever,
    # so the bot wakes up every 5 minutes and listens for ~4.5 of them.
    # Expect a reply within 5-15 minutes - GitHub often delays short crons.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Its own group, so a long listen never cancels a queued scan run.
# The two workflows touch different files in state/, and the push step below
# rebases and retries, so they can safely overlap.
concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Listen for commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py 270

      - name: Persist account settings
        run: |
          if [ -z "$(git status --porcelain state/)" ]; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git commit -m "state: account settings"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            git rebase --abort || true
            sleep 5
          done
          echo "could not push state after 3 attempts"
          exit 1
