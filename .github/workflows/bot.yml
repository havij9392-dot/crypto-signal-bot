name: bot

on:
  schedule:
    # Actions cannot hold a process forever, so each run listens for 20 minutes
    # and the schedule re-arms it. A short 5-minute cron was tried first and
    # GitHub dropped most of the runs, so button presses sat unanswered for
    # hours: a long window per run covers far more time than many tiny ones.
    # The 10-minute gap absorbs GitHub's scheduling jitter without queueing.
    - cron: "*/30 * * * *"
  # A push that touches the bot restarts it at once, so new code takes effect
  # immediately instead of waiting for the next cron - and the very first run
  # is what makes GitHub register the schedule above.
  push:
    paths:
      - "bot.py"
      - "users.py"
      - "account.py"
      - "papertrade.py"
      - ".github/workflows/bot.yml"
  workflow_dispatch:

permissions:
  contents: write

# Its own group, so a long listen never cancels a queued scan run.
# The two workflows touch different files in state/, and the push step below
# rebases and retries, so they can safely overlap.
concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 28

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Listen for commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # 1200s of listening inside a 28-minute job: the remaining minutes are
        # the margin that guarantees the commit below always runs.
        run: python bot.py 1200

      - name: Persist account settings
        if: always()
        run: |
          if [ -z "$(git status --porcelain state/)" ]; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git commit -m "state: account settings"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            git rebase --abort || true
            sleep 5
          done
          echo "could not push state after 3 attempts"
          exit 1
